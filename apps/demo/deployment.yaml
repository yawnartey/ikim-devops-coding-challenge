apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "message from OpenBao: $MESSAGE"
              while true; do sleep 3600; done
          env:
            - name: MESSAGE
              valueFrom:
                secretKeyRef:
                  name: demo-config
                  key: message
