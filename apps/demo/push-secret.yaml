apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-secret-generator
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-secret-generator
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-secret-generator
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: demo-secret-generator
    namespace: demo
roleRef:
  kind: Role
  name: demo-secret-generator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-secret-generator
  namespace: demo
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: demo-secret-generator
      restartPolicy: OnFailure
      containers:
        - name: generate
          image: alpine/k8s:1.30.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              API_KEY=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
              kubectl create secret generic demo-generated \
                --namespace=demo \
                --from-literal=api-key="$API_KEY" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "demo-generated secret created."
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: demo-push
  namespace: demo
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    secret:
      name: demo-generated
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: demo/pushed
          property: api-key
