apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-seed-script
  namespace: openbao
data:
  run.sh: |
    #!/bin/sh
    set -eu

    ADDR="https://openbao-active.openbao.svc.cluster.local:8200"
    ROOT_TOKEN=$(kubectl get secret openbao-unseal-keys -n openbao -o jsonpath='{.data.root_token}' | base64 -d)

    echo "Waiting for an active, unsealed OpenBao node"
    elapsed=0
    until [ "$(curl -sk "${ADDR}/v1/sys/seal-status" 2>/dev/null | jq -r '.sealed' 2>/dev/null)" = "false" ]; do
      sleep 5
      elapsed=$((elapsed + 5))
      if [ "$elapsed" -ge 180 ]; then
        echo "Timed out waiting for an active OpenBao node"
        exit 1
      fi
    done

    echo "Seeding demo secret"
    resp=$(curl -sk -H "X-Vault-Token: $ROOT_TOKEN" -X POST "${ADDR}/v1/secret/data/demo/config" \
      -d '{"data": {"message": "hello from openbao"}}')

    if [ -n "$resp" ] && echo "$resp" | jq -e '(.errors // []) | length > 0' >/dev/null 2>&1; then
      echo "FAILED to seed demo secret" >&2
      echo "$resp" >&2
      exit 1
    fi

    echo "Demo secret seeded."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-seed
  namespace: openbao
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: openbao-init-unseal
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: alpine/k8s:1.30.0
          command: ["/bin/sh", "/scripts/run.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: demo-seed-script
            defaultMode: 0755
