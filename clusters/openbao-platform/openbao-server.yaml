apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-server
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/openbao/server
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: cert-manager
    - name: postgres
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openbao
      namespace: openbao
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: openbao-tls
      namespace: openbao
