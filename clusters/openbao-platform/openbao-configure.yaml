apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-configure
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/openbao/configure
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: openbao-init
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: openbao-configure
      namespace: openbao
