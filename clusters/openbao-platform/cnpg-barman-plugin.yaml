apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-barman-plugin
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/cnpg-barman-plugin
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: cnpg
    - name: cert-manager-issuers
