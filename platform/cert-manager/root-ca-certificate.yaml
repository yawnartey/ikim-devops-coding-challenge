apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-platform-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: openbao-platform-root-ca
  secretName: openbao-platform-root-ca-secret
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
