apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-configure-script
  namespace: openbao
data:
  run.sh: |
    #!/bin/sh
    set -eu

    ADDR="https://openbao.openbao.svc.cluster.local:8200"
    ROOT_TOKEN=$(kubectl get secret openbao-unseal-keys -n openbao -o jsonpath='{.data.root_token}' | base64 -d)

    MOUNTED=$(curl -sk -H "X-Vault-Token: $ROOT_TOKEN" "${ADDR}/v1/sys/mounts" | jq -r 'has("secret/")')
    if [ "$MOUNTED" = "false" ]; then
      echo "Enabling kv-v2 secrets engine..."
      curl -sk -H "X-Vault-Token: $ROOT_TOKEN" -X POST "${ADDR}/v1/sys/mounts/secret" \
        -d '{"type": "kv-v2"}'
    else
      echo "kv-v2 already enabled."
    fi

    AUTH_ENABLED=$(curl -sk -H "X-Vault-Token: $ROOT_TOKEN" "${ADDR}/v1/sys/auth" | jq -r 'has("kubernetes/")')
    if [ "$AUTH_ENABLED" = "false" ]; then
      echo "Enabling Kubernetes auth..."
      curl -sk -H "X-Vault-Token: $ROOT_TOKEN" -X POST "${ADDR}/v1/sys/auth/kubernetes" \
        -d '{"type": "kubernetes"}'
    else
      echo "Kubernetes auth already enabled."
    fi

    echo "Configuring Kubernetes auth backend..."
    KUBE_CA_JSON=$(jq -Rs '.' /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
    curl -sk -H "X-Vault-Token: $ROOT_TOKEN" -X POST "${ADDR}/v1/auth/kubernetes/config" \
      -d "{\"kubernetes_host\": \"https://kubernetes.default.svc:443\", \"kubernetes_ca_cert\": ${KUBE_CA_JSON}}"

    echo "Writing eso-policy..."
    curl -sk -H "X-Vault-Token: $ROOT_TOKEN" -X PUT "${ADDR}/v1/sys/policies/acl/eso-policy" \
      -d '{"policy": "path \"secret/data/*\" {\n  capabilities = [\"create\", \"read\", \"update\", \"delete\", \"list\"]\n}"}'

    echo "Creating eso-role bound to the ESO ServiceAccount..."
    curl -sk -H "X-Vault-Token: $ROOT_TOKEN" -X POST "${ADDR}/v1/auth/kubernetes/role/eso-role" \
      -d '{
        "bound_service_account_names": "external-secrets",
        "bound_service_account_namespaces": "external-secrets",
        "bound_audiences": "vault",
        "policies": "eso-policy",
        "ttl": "1h"
      }'

    echo "OpenBao configuration complete."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-configure
  namespace: openbao
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: openbao-init-unseal
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: alpine/k8s:1.30.0
          command: ["/bin/sh", "/scripts/run.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: openbao-configure-script
            defaultMode: 0755
